name: render
on:
  workflow_dispatch:
    inputs:
      frames:  { description: "Frame ranges: START-END[,START-END...]; prefix b (b700-766) = render with --before", default: "1-766" }
      chunks:  { description: "Number of parallel render jobs (max 20)", default: "20" }
      res:     { description: "Resolution WxH", default: "720x1280" }
      samples: { description: "Cycles samples", default: "32" }
      extra:   { description: "Extra scene.py flags (e.g. --before)", default: "" }
      cleanup: { description: "yes = only delete the branch out (after it was fetched)", default: "no" }

permissions:
  contents: write

jobs:
  cleanup:
    if: inputs.cleanup == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git push origin --delete out || true

  plan:
    if: inputs.cleanup != 'yes'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env: { FR: "${{ inputs.frames }}", CH: "${{ inputs.chunks }}" }
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os
          segs = []
          for r in os.environ["FR"].split(","):
              r = r.strip()
              if r:
                  bf = r.startswith("b"); s, e = map(int, r.lstrip("b").split("-")); segs.append((s, e, bf))
          total = sum(e - s + 1 for s, e, _ in segs); n = max(1, min(20, int(os.environ["CH"])))
          size = -(-total // n)
          while sum(-(-(e - s + 1) // size) for s, e, _ in segs) > 20:   # never drop a range: grow chunks until all fit
              size += 1
          assert len(segs) <= 20, "more than 20 ranges"
          inc = []
          for s, e, bf in segs:                  # chunks never cross a segment boundary
              a = s
              while a <= e:
                  b = min(e, a + size - 1)
                  inc.append({"idx": len(inc), "range": f"{a}-{b}", "extra": "--before" if bf else ""}); a = b + 1
          print("matrix=" + json.dumps({"include": inc}))
          PY

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: System libraries for bpy
        run: sudo apt-get update -q && sudo apt-get install -y -q libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1
      - name: Install bpy
        run: pip install -q bpy==5.2.2
      - name: Render chunk ${{ matrix.idx }} (${{ matrix.range }})
        run: python scene.py --frames ${{ matrix.range }} --res ${{ inputs.res }} --samples ${{ inputs.samples }} ${{ matrix.extra }} ${{ inputs.extra }} --out out
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.idx }}
          path: out/*.png
          retention-days: 1
          if-no-files-found: error

  encode:
    # silent H.264 (CRF 14) per frame range, force-pushed to the orphan branch "out"
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "frames-*", merge-multiple: true, path: frames }
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Encode
        env: { FR: "${{ inputs.frames }}" }
        run: |
          mkdir -p mp4
          for r in ${FR//,/ }; do
            pre=frame; tag=""; case $r in b*) pre=before; tag=b; r=${r#b};; esac
            s=${r%-*}; e=${r#*-}; n=$((e - s + 1))
            ffmpeg -y -loglevel error -framerate 24 -start_number "$s" -i frames/${pre}_%04d.png -frames:v "$n" \
              -an -c:v libx264 -preset slow -crf 14 -pix_fmt yuv420p -movflags +faststart "mp4/frames-$tag$s-$e.mp4"
            sz=$(stat -c %s "mp4/frames-$tag$s-$e.mp4")
            if [ "$sz" -gt 95000000 ]; then        # keep every file under GitHub's 100 MB limit
              rm "mp4/frames-$tag$s-$e.mp4"
              for ((a = s; a <= e; a += 240)); do b=$((a + 239 < e ? a + 239 : e))
                ffmpeg -y -loglevel error -framerate 24 -start_number "$a" -i frames/${pre}_%04d.png -frames:v $((b - a + 1)) \
                  -an -c:v libx264 -preset slow -crf 14 -pix_fmt yuv420p -movflags +faststart "mp4/frames-$tag$a-$b.mp4"
              done
            fi
          done
          ls -l mp4
      - name: Push to branch "out"
        run: |
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          git checkout --orphan out
          git rm -rf -q --cached .
          git add -f mp4/*.mp4
          git commit -q -m "frames ${{ inputs.frames }} @ ${{ inputs.res }}"
          git push -f origin out
